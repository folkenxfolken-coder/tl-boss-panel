name: Probe boss icons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_boss_icons.py"
      - ".github/workflows/probe-boss-icons.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_boss_icons.py
